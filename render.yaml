services:
  - type: web
    name: smartloan-backend
    env: python
    rootDir: backend
    buildCommand: pip install --upgrade pip && pip install -r requirements.txt
    startCommand: uvicorn main:app --host 0.0.0.0 --port $PORT
    plan: free
    autoDeploy: true
    envVars:
      - key: SMARTLOAN_JWT_SECRET
        generateValue: true
      - key: SMARTLOAN_OFFICER_EMAIL
        value: officer@smartloan.ai
      - key: SMARTLOAN_OFFICER_PASSWORD
        value: Officer@SmartLoan2024
      - key: ALLOWED_ORIGINS
        value: http://localhost:5173,http://localhost:5174,http://localhost:5175,https://smartloan-ai-pro.vercel.app
